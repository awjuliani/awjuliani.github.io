# Creations - Open source projects and websites
# Each creation can link to either a website or GitHub repository

creations:
  - title: "ML-Agents Toolkit"
    description: "Open-source Unity plugin for training intelligent agents using reinforcement learning and imitation learning."
    image: "/assets/img/creations/ml-agents.png"
    link: "https://github.com/Unity-Technologies/ml-agents"
    link_type: "github"
    tags:
      - reinforcement-learning
      - unity
      - python

  - title: "Obstacle Tower"
    description: "Procedurally generated 3D environment for benchmarking AI agents on generalization and sparse reward learning."
    image: "/assets/img/creations/obstacle-tower.png"
    link: "https://github.com/Unity-Technologies/obstacle-tower-env"
    link_type: "github"
    tags:
      - reinforcement-learning
      - benchmark
      - unity

  - title: "Neuro-Nav"
    description: "A library for neurally-plausible reinforcement learning research, focusing on navigation and spatial cognition."
    image: "/assets/img/creations/neuro-nav.png"
    link: "https://github.com/awjuliani/neuro-nav"
    link_type: "github"
    tags:
      - neuroscience
      - reinforcement-learning
      - python

  - title: "Dream JRPG"
    description: "An experiment in using LLMs to procedurally generate simple Japanese-style RPGs with dynamic storylines, characters, and combat."
    image: "/assets/img/creations/dream-jrpg.png"
    link: "https://github.com/awjuliani/dream-jrpg"
    link_type: "github"
    tags:
      - generative-ai
      - games
      - python

  - title: "RL Playground"
    description: "Interactive web-based demonstration of tabular reinforcement learning algorithms in a grid world environment."
    image: "/assets/img/creations/rl-playground.png"
