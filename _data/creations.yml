    link: "https://github.com/Unity-Technologies/ml-agents"
    link_type: "github"
    tags:
      - reinforcement-learning
      - unity
      - python

  - title: "Obstacle Tower"
    description: "Procedurally generated 3D environment for benchmarking AI agents on generalization and sparse reward learning."
